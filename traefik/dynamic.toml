[tcp]
  [tcp.routers]
    [tcp.routers.pixelmon]
      rule = "HostSNI(`pixelmon`)"
      service = "pixelmon-service"
      entryPoints = ["minecraft"]

    [tcp.routers.terraria]
      rule = "HostSNI(`terraria`)"
      service = "terraria-service"
      entryPoints = ["terraria"]

  [tcp.services]
    [tcp.services.pixelmon-service.loadBalancer]
      [[tcp.services.pixelmon-service.loadBalancer.servers]]
        address = "localhost:32003"

    [tcp.services.terraria-service.loadBalancer]
      [[tcp.services.terraria-service.loadBalancer.servers]]
        address = "localhost:20479"

[entryPoints]
  [entryPoints.minecraft]
    address = ":25565"
  [entryPoints.terraria]
    address = ":7777"

[http]
  [http.routers]
    [http.routers.dashboard]
      rule = "Host(`traefik`)"
